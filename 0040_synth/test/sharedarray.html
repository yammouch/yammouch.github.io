<!DOCTYPE html>
<html>
<head>
<script type="module">

import { RingBuf } from '../ringbuf.js';

let audioContext;
let squareNode = null;
let evq;

window.addEventListener("load", () => {
  audioContext = new AudioContext();
  play().then( () => {
    squareNode.port.postMessage({ cmd: "evq_get", i: 0 });
    setTimeout(() => {
      const view = new Uint32Array(evq);
      evq.data[0] = 1234567890;
      Atomics.store(evq.data, 1, 3333333333);
      Atomics.store(evq.wptr, 0, 5);
      Atomics.store(evq.rptr, 0, 7);
      squareNode.port.postMessage({ cmd: "evq_get", i: 0 });
      squareNode.port.postMessage({ cmd: "evq_get", i: 1 });
      squareNode.port.postMessage({ cmd: "evq_wptr" });
      squareNode.port.postMessage({ cmd: "evq_rptr" });
    }, 100);
  });
});

async function play() {
  await audioContext.audioWorklet.addModule("../keyon.js");
  squareNode = new AudioWorkletNode(
    audioContext,
    "sq-pr",
  );
  let wasm = null;
  const resp = await fetch("../engine/pkg/reson_bg.wasm");
  if (resp.ok) {
    wasm = await resp.arrayBuffer();
  } else {
    console.log("fetch failed");
  }
  let shared_test = document.getElementById("shared_test");
  squareNode.connect(audioContext.destination);
  squareNode.port.onmessage = (e) => {
    shared_test.innerText += e.data.i + " " + e.data.val + "\n";
  };
  evq = new RingBuf(32);
  squareNode.port.postMessage({
   cmd       : "init",
   sampleRate: audioContext.sampleRate,
   master    : 440,
   wasm      : wasm,
   evq       : evq,
  });
}

</script>
<body>

<div id="shared_test"></div>

</body>
</html>
